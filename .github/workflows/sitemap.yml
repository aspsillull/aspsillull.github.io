name: Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-sitemap
  cancel-in-progress: true

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache= ''
 
      - name: Install dependencies
        run: npx --yes sitemap-generator-cli

      - name: Generate sitemap
        run: |
          set -e
          npx --yes sitemap-generator-cli https://aspsillull.github.io \
            --output ./sitemap.xml \
            --changefreq weekly \
            --max-entries-per-file 5000

      - name: Commit and push sitemap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet --exit-code || (git commit -m "Regenerate sitemap [skip ci]" && git push)
